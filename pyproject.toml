[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilla"
version = "0.1.0"
description = "Tilla — AI storefront builder with crypto checkout on X Layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "requests==2.34.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "okxweb3-app-x402==0.1.0",
    # MPP pay-as-you-go (M8). RUNTIME deps: the SA client (okxweb3-app-mpp, which
    # installs module `mpp_evm`) and its base (pympp -> module `mpp`) are imported
    # LAZILY inside app/mpp.py only when TILLA_MPP_ENABLED + SA creds are set, so
    # they never load while the rail is dormant — but they must be installed for
    # that live path to exist. Pinned to the verified versions.
    "pympp==0.9.1",
    "okxweb3-app-mpp==0.1.0",
    "slowapi==0.1.10",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "itsdangerous==2.2.0",
    # Phase 4 custom domains: DNS TXT ownership challenge lookups (read-only, no
    # connection to the claimed host). Already present transitively; pinned here
    # because app/domains.py imports it on the request path.
    "dnspython==2.8.0",
    "python-multipart==0.0.32",
    "eth-account==0.13.7",
    # M11 EAS receipt attester. Imported LAZILY inside app/attest.py's enabled path
    # only (flag + key), so a dormant boot never loads it — but it must be installed
    # for that live path (build the attest tx, sign, broadcast, read the receipt).
    # Pinned to the exact version already on the VPS (the x402 branch uses it too).
    "web3==7.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "coverage==7.15.2",
    "ruff==0.15.22",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
