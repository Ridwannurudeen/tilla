<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{STORE_NAME}} — {{TAGLINE}}</title>
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="description" content="{{META_DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{STORE_NAME}}">
<meta property="og:description" content="{{META_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{STORE_NAME}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<script type="application/ld+json">{{ PRODUCT_JSONLD | tojson }}</script>
<style>
  :root{ --primary:{{C_PRIMARY}}; --accent:{{C_ACCENT}}; --bg:{{C_BG}}; --text:{{C_TEXT}}; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap{ max-width:820px; margin:0 auto; padding:0 24px; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:30px 0; }
  .brand{ display:flex; align-items:center; gap:12px; font-weight:800; font-size:20px; }
  .logo{ width:46px; height:46px; display:grid; place-items:center; font-size:25px; border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--accent)); }
  .hero{ text-align:center; padding:64px 0 36px; }
  .hero h1{ font-size:clamp(32px,6vw,56px); font-weight:900; letter-spacing:-.03em; }
  .hero p{ margin:18px auto 0; max-width:540px; font-size:17px;
    color:color-mix(in srgb,var(--text) 72%,transparent); }
  .card{ margin:30px auto 0; max-width:500px; border-radius:20px; padding:28px;
    background:color-mix(in srgb,var(--text) 6%,transparent);
    border:1px solid color-mix(in srgb,var(--text) 14%,transparent); }
  .card h2{ font-size:22px; font-weight:800; }
  .card .blurb{ margin-top:10px; color:color-mix(in srgb,var(--text) 72%,transparent); }
  .price{ margin-top:20px; display:flex; align-items:baseline; gap:10px; }
  .price .n{ font-size:38px; font-weight:900; }
  .price .u{ font-size:15px; font-weight:700; color:var(--accent); }
  .buy{ margin-top:20px; width:100%; border:0; cursor:pointer; padding:16px; border-radius:14px;
    font-size:16px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,var(--primary),var(--accent)); }
  .checkout{ display:none; margin-top:20px; padding:18px; border-radius:14px;
    background:color-mix(in srgb,var(--bg) 60%,#000);
    border:1px dashed color-mix(in srgb,var(--text) 25%,transparent); font-size:14px; }
  .checkout.on{ display:block; }
  .row{ display:flex; justify-content:space-between; gap:10px; margin:6px 0; }
  .addr{ font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; color:var(--accent); }
  .status{ margin-top:10px; font-weight:700; color:color-mix(in srgb,var(--text) 70%,transparent); }
  footer{ text-align:center; padding:52px 0 40px; font-size:13px;
    color:color-mix(in srgb,var(--text) 45%,transparent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">{{EMOJI}}</span> {{STORE_NAME}}</div>
    <span>Pay with crypto · X Layer</span>
  </header>

  <section class="hero">
    <h1>{{HERO_HEADLINE}}</h1>
    <p>{{HERO_SUBCOPY}}</p>
  </section>

  <section class="card">
    <h2>{{PRODUCT_NAME}}</h2>
    <div class="blurb">{{PRODUCT_BLURB}}</div>
    <div class="price"><span class="n">{{PRICE}}</span><span class="u">USDT</span></div>
    <button class="buy" id="buyBtn">{{CTA_TEXT}} →</button>
    {% include "_checkout.html" %}
  </section>

  <footer>Powered by <b>Tilla</b> · Midnight theme · settled on X Layer</footer>
</div>
<script>
  // No inline on*= handlers (install lint bans them); wire the buy button to the
  // checkout partial's global via a JS property assignment instead.
  document.getElementById("buyBtn").onclick = startCheckout;
</script>
</body>
</html>
