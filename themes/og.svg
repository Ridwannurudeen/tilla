<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="{{STORE_NAME}}">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{C_BG}}"/>
      <stop offset="1" stop-color="{{C_PRIMARY}}"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{{C_PRIMARY}}"/>
      <stop offset="1" stop-color="{{C_ACCENT}}"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="{{C_BG}}" opacity="0.35"/>
  <circle cx="1060" cy="120" r="280" fill="url(#accent)" opacity="0.22"/>
  <rect x="90" y="88" width="72" height="72" rx="18" fill="url(#accent)"/>
  <text x="126" y="140" font-size="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">{{EMOJI}}</text>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="{{C_TEXT}}">
    <text x="90" y="330" font-size="92" font-weight="800" letter-spacing="-3">{{STORE_NAME}}</text>
    <text x="92" y="400" font-size="40" fill="{{C_ACCENT}}" font-weight="600">{{TAGLINE}}</text>
    <text x="90" y="520" font-size="46" font-weight="700">{{PRODUCT_NAME}}</text>
    <text x="90" y="582" font-size="36" fill="{{C_ACCENT}}" font-weight="700">{{PRICE}} USDT</text>
    <text x="1110" y="585" font-size="26" text-anchor="end" fill="{{C_TEXT}}" opacity="0.7">Powered by Tilla · X Layer</text>
  </g>
</svg>
