# Pinned JSON Schema (Draft 2020-12) for a Tilla per-store product feed served at
# GET /s/{slug}/feed.json. Shape derived from the ACP product-feed convention
# (spec 2026-04-17): a store block plus a list of products, each advertising its
# x402 buy endpoint. Committed so feed.json is validated against a fixed contract
# (tests/test_agentic.py) rather than an ad-hoc assertion.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://tilla.gudman.xyz/schemas/feed.json"
title: "Tilla product feed"
type: object
additionalProperties: false
required: [store, products]
properties:
  store:
    type: object
    additionalProperties: false
    required: [slug, name, description, url]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,39}$"
      name:
        type: string
      description:
        type: string
      url:
        type: string
        format: uri
  products:
    type: array
    items:
      type: object
      additionalProperties: false
      # requiredFunds + nextActions are additive (a Tilla feed always emits them, but
      # this schema also validates INBOUND federated peer feeds, which need not) — so
      # they are defined below but not in `required`.
      required: [id, title, description, link, price, availability, x402]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        link:
          type: string
          format: uri
        # The product's photograph, absolute. Present only when the store HAS one —
        # a store selling something with no honest photograph (a template, a service)
        # omits the key rather than emitting an empty or placeholder URL, so an agent
        # never has to tell "no picture" apart from "broken picture". Optional here for
        # the same reason it is optional on the wire, and because this schema also
        # validates INBOUND federated peer feeds.
        image_url:
          type: string
          format: uri
        # Phase 1.3 SLA: the delivery-time promise (minutes) the buyer agent should
        # expect — a per-product ETA it can rank providers on.
        sla_minutes:
          type: integer
          minimum: 1
        price:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount:
              type: string
              pattern: "^[0-9]+(\\.[0-9]+)?$"
            currency:
              type: string
              const: "USDT"
        availability:
          type: string
          enum: ["in_stock", "out_of_stock"]
        # M8 payment-method declaration (additive). Deployed agents ignore unknown
        # keys; the model is the declared rail and params its public config.
        pricing:
          type: object
          additionalProperties: false
          required: [model, params]
          properties:
            model:
              type: string
              enum: ["one_time", "batch", "metered", "subscription"]
            params:
              type: object
            # M16 B2B (additive): an opt-in flag that the product offers wholesale
            # tiers. The tier TABLE itself is never exposed here (INV-B) — only this
            # boolean; a per-buyer price comes from GET /s/{slug}/quote per-request.
            wholesale:
              type: boolean
        x402:
          type: object
          additionalProperties: false
          required: [endpoint, network, asset]
          properties:
            endpoint:
              type: string
              pattern: "^/s/[a-z0-9][a-z0-9-]{0,39}/buy(/[0-9]+)?$"
            network:
              type: string
              const: "eip155:196"
            asset:
              type: string
              pattern: "^0x[0-9a-fA-F]{40}$"
            # Enabled x402 buy schemes (additive). 'exact' always; 'aggr_deferred'
            # only on batch products when the server flag is on.
            schemes:
              type: array
              items:
                type: string
                enum: ["exact", "aggr_deferred"]
        # Offering envelope (agent-native): the exact funds the x402 buy endpoint
        # demands. Byte-identical to the live 402 charge — amount = product price in
        # micro-USDT, asset/network the canonical rail, pay_to the merchant wallet
        # (NON-CUSTODIAL). An agent can transact straight from this block.
        requiredFunds:
          type: object
          additionalProperties: false
          required: [amount_micro, amount, currency, asset, network, pay_to]
          properties:
            amount_micro:
              type: integer
              minimum: 0
            amount:
              type: string
              pattern: "^[0-9]+(\\.[0-9]+)?$"
            currency:
              type: string
              const: "USDT"
            asset:
              type: string
              pattern: "^0x[0-9a-fA-F]{40}$"
            network:
              type: string
              const: "eip155:196"
            pay_to:
              type: string
              pattern: "^0x[0-9a-fA-F]{40}$"
        # The concrete next step(s) an agent takes to acquire this offering — each
        # naming a real, reachable endpoint/tool on this store.
        nextActions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            required: [type, description]
            properties:
              type:
                type: string
              description:
                type: string
        # Phase 1.2 agent-surface (additive): a typed JSON-Schema of the fields an
        # agent may supply to the x402 buy endpoint. Both are optional query params —
        # the product is fixed by the x402 endpoint path and payment travels in the
        # x402 header. Feed consumers that predate it ignore the unknown key.
        input_schema:
          type: object
          additionalProperties: true
          required: [type, properties]
          properties:
            type:
              type: string
              const: object
            properties:
              type: object
