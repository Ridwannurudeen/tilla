# Pinned JSON Schema (Draft 2020-12) for the structuredContent of the MCP
# `get_product` tool result (POST /s/{slug}/mcp, method tools/call). Frozen by
# tilla-protocol-v1. The pricing block carries the model + public params and an
# opt-in `wholesale: true` flag but NEVER the tier table; the optional `quote`
# object mirrors the /quote surface and appears only for a supplied, verifiable
# agent id. Validated live by tests/test_protocol_goldens.py.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://tilla.gudman.xyz/schemas/mcp-get-product.json"
title: "Tilla MCP get_product structuredContent"
type: object
additionalProperties: false
required:
  [id, name, description, price, price_micro, currency, network,
   deliverable_kind, pricing, x402, requiredFunds, nextActions]
properties:
  id:
    type: integer
  name:
    type: string
  description:
    type: string
  price:
    type: number
  price_micro:
    type: integer
    minimum: 1
  currency:
    type: string
  network:
    type: string
  sla_minutes:
    type: integer
    minimum: 1
  deliverable_kind:
    type: string
    enum: [file, text, license]
  pricing:
    type: object
    additionalProperties: false
    required: [model, params]
    properties:
      model:
        type: string
        enum: [one_time, batch, metered, subscription]
      params:
        type: object
      wholesale:
        type: boolean
  x402:
    type: object
    additionalProperties: false
    required: [endpoint, network, asset, schemes]
    properties:
      endpoint:
        type: string
      network:
        type: string
      asset:
        type: string
      schemes:
        type: array
        items:
          type: string
  # Offering envelope: the exact funds the x402 buy endpoint demands (identical to
  # the live 402 charge; pay_to = merchant, non-custodial) + the concrete next steps.
  requiredFunds:
    type: object
    additionalProperties: false
    required: [amount_micro, amount, currency, asset, network, pay_to]
    properties:
      amount_micro:
        type: integer
        minimum: 0
      amount:
        type: string
      currency:
        type: string
      asset:
        type: string
        pattern: "^0x[0-9a-fA-F]{40}$"
      network:
        type: string
      pay_to:
        type: string
        pattern: "^0x[0-9a-fA-F]{40}$"
  nextActions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: true
      required: [type, description]
      properties:
        type:
          type: string
        description:
          type: string
  quote:
    type: object
    additionalProperties: false
    required: [agent_id, tier_price_micro, tier_price, owner, requires]
    properties:
      agent_id:
        type: integer
      tier_price_micro:
        type: integer
        minimum: 1
      tier_price:
        type: string
      owner:
        type: string
        pattern: "^0x[0-9a-f]{40}$"
      requires:
        type: string
