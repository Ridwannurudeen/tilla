[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilla-sdk"
version = "0.1.0"
description = "Sync, typed, dependency-light client for the Tilla storefront API (browse, human checkout, MCP, x402 create-store + buy)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Dependency-light on purpose: only httpx is required. The x402 pay paths need a
# caller-supplied signer; the shipped LocalEip3009Signer needs the [signer] extra.
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed to use the shipped LocalEip3009Signer (local EIP-3009 signing). A
# remote-signer implementation of PaymentSigner needs none of this.
signer = [
    "eth-account>=0.13",
]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "eth-account>=0.13",
]

[tool.setuptools]
packages = ["tilla_sdk"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
