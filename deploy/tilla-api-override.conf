# Tilla API systemd hardening + self-heal drop-in.
#
# Installed on the VPS as:
#   /etc/systemd/system/tilla-api.service.d/override.conf
# This is a DROP-IN: the base tilla-api.service and User=root are UNTOUCHED. The full
# unprivileged-user migration (a tilla user, chown /opt/tilla, ProtectSystem=strict) is
# the documented careful follow-up in docs/OPS.md, not this module.
#
# Why this exact set is access-safe: ProtectSystem=full makes only /usr, /boot, /efi,
# /etc read-only — /opt STAYS WRITABLE, so tilla.db+WAL, stores/, deliverables/,
# backups/ and the sweeper are unaffected; /opt/tilla/.env is loaded via EnvironmentFile
# at unit start (and lives outside protected paths anyway). RestrictAddressFamilies keeps
# TCP for RPC / facilitator / Anthropic / Telegram egress. RestartSec=3 spaces restarts so
# systemd's default start-limit (5 in 10s) can never latch the unit into a failed state.
#
# Apply: mkdir -p /etc/systemd/system/tilla-api.service.d && cp this to override.conf;
#        systemctl daemon-reload && systemctl restart tilla-api; smoke /health + /ready.
# Rollback: rm -r /etc/systemd/system/tilla-api.service.d && systemctl daemon-reload &&
#           systemctl restart tilla-api.
[Service]
Restart=always
RestartSec=3
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=full
ProtectHome=read-only
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
