# Store subdomains — <slug>.tilla.gudman.xyz
# Companion doc: deploy/nginx-wildcard-subdomains.snippet
#
# nginx prefers an EXACT server_name over a wildcard, so the tilla.gudman.xyz
# vhost keeps every request for the bare platform host and its landing page. This
# block only ever answers for labels beneath it.

server {
    listen 80;
    listen [::]:80;
    server_name *.tilla.gudman.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.tilla.gudman.xyz;

    ssl_certificate     /etc/letsencrypt/live/tilla-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tilla-wildcard/privkey.pem;

    # Same set as the platform vhost. Restate ALL of them in any location that
    # adds one of its own — a single add_header inside a location cancels every
    # inherited one (see nginx-hardening.snippet).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # DELIBERATELY SHORT, unlike the platform host's one year. This certificate
    # was issued with manual DNS-01, and its renewal config runs an auth hook that
    # WAITS FOR A HUMAN to publish a fresh TXT record — so `certbot renew` cannot
    # complete unattended and this cert WILL lapse around 2026-10-24 unless the
    # renewal is automated first. A one-year HSTS would turn that lapse into a hard
    # outage for every store subdomain, because browsers would refuse the HTTP
    # fallback. Raise this to 31536000 only after a DNS-API plugin makes renewal
    # unattended and a real renewal has been observed succeeding on its own.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        limit_req zone=tilla_api burst=30 nodelay;
        client_max_body_size 26m;
        proxy_pass http://127.0.0.1:8040;
        # Load-bearing, not boilerplate: the app resolves WHICH store this is from
        # the Host header (app/main.py::_platform_subdomain_slug). Drop this and
        # every subdomain 404s.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
