[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# X Layer RPC endpoints for `forge script ... --rpc-url xlayer` (deploy is
# USER-RUN only — build agents never broadcast; see README.md).
[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
xlayer_testnet = "https://testrpc.xlayer.tech/terigon"
